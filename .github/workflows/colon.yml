name: colon
"on":
  push:
    branches: [main]
    paths: [".colon_trigger"]
  workflow_dispatch:

jobs:
  mk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: create colon-named blobs
        run: |
          set -e
          D="v2/library/probe/blobs"
          echo "--- before ---"
          ls -la "$D" || true
          for f in "$D"/*; do
            b=$(basename "$f")
            case "$b" in
              sha256:*) echo "skip $b" ;;
              *) cp -v "$f" "$D/sha256:$b" ;;
            esac
          done
          echo "--- after ---"
          ls -la "$D"
      - name: commit and push
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "add sha256: prefixed blob names"
            git push origin HEAD:main
          fi
